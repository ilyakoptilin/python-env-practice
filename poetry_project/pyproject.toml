[project]
name = "weather-temp"
version = "0.1.0"
description = "Moscow 24h temperature"
authors = [
    {name = "Student",email = "student@example.com"}
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "requests (>=2.34.2,<3.0.0)",
    "pandas (>=3.0,<4.0)",
    "matplotlib (>=3.11.2,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[dependency-groups]
test = [
    "pytest (>=9.1.1,<10.0.0)"
]
dev = [
    "ruff (>=0.16.9,<0.17.0)"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
